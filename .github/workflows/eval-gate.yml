name: eval-gate

# Runs the pytest suite and then the eval harness itself against the
# golden evaluation set on every push and pull request. The job fails the
# build if the aggregate score over the golden set drops below the
# threshold documented in README.md (currently 0.50) -- so a change that
# regresses faithfulness, relevance, or context precision/recall on the
# labeled golden set is caught in CI, not after it ships.

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest suite
        run: pytest -v

      - name: Run eval gate against golden set
        run: |
          python -m evalharness.cli \
            --dataset data/golden_set.json \
            --threshold 0.50 \
            --fail-under \
            --worst 5
