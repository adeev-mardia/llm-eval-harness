[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-harness"
version = "0.1.0"
description = "An offline-first evaluation harness for RAG/LLM pipeline outputs, with CI-gated scoring."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Adeev Mardia" }
]
keywords = ["rag", "evaluation", "llm", "nlp", "faithfulness", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
judge = ["requests>=2.28"]
dev = ["pytest>=7.0", "requests>=2.28"]

[project.scripts]
evalharness = "evalharness.cli:main"

[tool.setuptools.packages.find]
include = ["evalharness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
